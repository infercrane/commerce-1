name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-claims:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.9.13
      - name: Sync locked test environment
        run: uv sync --frozen --extra test
      - name: Run tests and blocked-claim gates
        run: uv run --frozen --extra test pytest
      - name: Lint
        run: uv run --frozen --extra test ruff check .
      - name: Check formatting
        run: uv run --frozen --extra test ruff format --check .
      - name: Build native runtime wheel
        run: uv build --wheel --out-dir ci-dist
